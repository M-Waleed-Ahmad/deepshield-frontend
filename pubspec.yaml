name: deepshield
description: "DeepShield - AI-powered deepfake detection with verification"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  google_fonts: ^6.0.0
  flutter_dotenv: ^5.0.2
  flutter_svg: ^2.0.9
  http: ^1.2.1
  file_picker: ^8.0.0
  intl: ^0.19.0
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.0
  open_file: ^3.3.2
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/vectors/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"